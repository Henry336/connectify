<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#502d55" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Connectify — free synchronized YouTube listening rooms and watch parties." />
    <link rel="icon" type="image/svg+xml" href="/connectify.svg" />
    <!-- iOS ignores the SVG icon and wants a full-bleed opaque PNG (it applies its own
         rounded-corner mask on top). connectify.svg has an inset, already-rounded
         background meant for in-app use, which is exactly what produced the visible
         whitespace/halo around the home-screen icon; SVG rasterization for this specific
         tag is also inconsistent across iOS versions, which was the separate blurriness. -->
    <!-- The ?v= query string exists purely to bust iOS Safari's own touch-icon cache,
         which does not reliably invalidate on a normal page reload -- an already-added
         home screen icon or a stale "Add to Home Screen" preview can keep referencing
         the old file at the old URL indefinitely otherwise. Bump the number whenever
         this specific asset changes again. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="mask-icon" href="/connectify-mono.svg" color="#502d55" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Without these, adding Connectify to an iPhone home screen still opens it inside
         Safari's own chrome (address bar, tab switcher) instead of as a standalone app.
         The manifest's display:standalone alone isn't reliably honored on iOS. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Connectify" />
    <link rel="preconnect" href="https://www.youtube.com" />
    <!-- SEO_HEAD -->
    <title>Connectify — Listen together</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
