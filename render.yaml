services:
  - type: web
    name: connectify-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm install && npm run build && npm run db:deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      # Second Google Cloud project's key, dedicated to automated Library growth so it
      # never competes with user-facing live search. Optional.
      - key: YOUTUBE_SEED_API_KEY
        sync: false
