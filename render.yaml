services:
  - type: web
    name: connectify-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
